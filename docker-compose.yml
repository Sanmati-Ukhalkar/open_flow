version: '3.8'

services:
  backend:
    build:
      context: .
      target: backend
    container_name: openflow_backend
    ports:
      - "3001:3001"
    volumes:
      - ./metadata.sqlite:/app/metadata.sqlite
      - ./database.sqlite:/app/database.sqlite
    environment:
      - PORT=3001
      - NODE_ENV=production
      - LOG_LEVEL=info
      - JWT_SECRET=production-secret-change-me
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: always

  frontend:
    build:
      context: .
      target: frontend
    container_name: openflow_frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:3001
    depends_on:
      - backend
    restart: always
