version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: openflow_redis
    ports:
      - "6380:6379"
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: openflow_api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production-secret-change-me
      - SQLITE_DB_PATH=/app/data/metadata.sqlite
      - STORAGE_DB_PATH=/app/data/database.sqlite
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - redis
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: openflow_worker
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - SQLITE_DB_PATH=/app/data/metadata.sqlite
      - STORAGE_DB_PATH=/app/data/database.sqlite
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - redis
      - api
    restart: always

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    container_name: openflow_scheduler
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - SQLITE_DB_PATH=/app/data/metadata.sqlite
      - STORAGE_DB_PATH=/app/data/database.sqlite
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - redis
      - api
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: openflow_web
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://api:3001
    depends_on:
      - api
    restart: always

volumes:
  sqlite_data:
